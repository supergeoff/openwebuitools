name: Deploy Actions

on:
  push:
    branches: [ main ]
    paths:
      - 'actions/**'
      - '.github/scripts/deploy-actions.py'
      - '.github/workflows/deploy-actions.yml'
  workflow_dispatch:

jobs:
  deploy-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Deploy actions to OpenWebUI
        env:
          OPENWEBUI_URL: ${{ secrets.OPENWEBUI_URL }}
          OPENWEBUI_API_KEY: ${{ secrets.OPENWEBUI_API_KEY }}
        run: python .github/scripts/deploy-actions.py
